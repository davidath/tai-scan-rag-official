risk_level:
  query: "Classify the risk category (Prohibited, High-risk, Medium-risk, Low-risk) for an AI system with the following specifications: - Role: $role - Domain: $domain - Type: $type - Input data: $input_data - Intended use: $intended_use. Provide a detailed rationale based on ethical, legal, and safety considerations, addressing: privacy concerns, accuracy and reliability, potential misuse, compliance with legal standards impact on civil liberties balance between security needs and individual rights."
  prompt: "Task: Answer the following question: $query \n Output: The output should be a single word representing the level of the system. \n Do not provide any additional information."
relevant_resources:
  query: "Retrieve the specific legal obligations and compliance requirements applicable to an AI system with the following characteristics: - Role: $role - Domain: $domain - Type: $type - Input data: $input_data - Intended use: $intended_use. Provide a detailed rationale based on ethical, legal, and safety considerations, addressing: privacy concerns, accuracy and reliability, potential misuse, compliance with legal standards impact on civil liberties balance between security needs and individual rights."
  prompt: "Task: Answer the following question: $query \n Output: The output should be a concise list of the relevant AI Act article numbers only, separated by commas (e.g., 'Articles 8, 11, 22, 33'). \n Do not provide any additional information."
obligation_gen:
  query: "Classify the risk category (Prohibited, High-risk, Medium-risk, Low-risk) for an AI system with the following specifications: - Role: $role - Domain: $domain - Type: $type - Input data: $input_data - Intended use: $intended_use. Provide a detailed rationale based on ethical, legal, and safety considerations, addressing: privacy concerns, accuracy and reliability, potential misuse, compliance with legal standards impact on civil liberties balance between security needs and individual rights."
  prompt: "Task: Answer the following question: $query \n Output: The output should be a numbered list with the relevant obligations and specific directions to comply. \n Do not provide any additional information."
